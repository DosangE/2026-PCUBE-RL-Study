# SoccerBots -- MA-POCA + Self-Play + Curriculum
#
# NOTE: this file is deliberately ASCII-only. mlagents-learn loads the YAML with Python's
# default locale codec (cp949 on a Korean Windows), NOT UTF-8, so any non-ASCII character
# here -- Korean, em-dash, arrows -- crashes the loader with:
#   TrainerConfigError: There was an error decoding Config file ... save using UTF-8
# The reward rationale in Korean lives in week4/RewardDesign.md instead.
#
# Run (parallel build -- use this for real training):
#   mlagents-learn week4/SoccerBots/configs/soccer.yaml \
#     --env=week4/SoccerBots/build/SoccerBots.exe \
#     --num-envs=8 --time-scale=20 --no-graphics --run-id=soccer_v1
#
# Run (in the Editor, to watch it play):
#   mlagents-learn week4/SoccerBots/configs/soccer.yaml --run-id=soccer_debug
#   then press Play in Unity when it says "Start training by pressing Play".

behaviors:
  Striker:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 30000000
    time_horizon: 1000
    threaded: true
    summary_freq: 20000
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

  Goalie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 30000000
    time_horizon: 1000
    threaded: true
    summary_freq: 20000
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

# Curriculum: the global float "lesson" that SoccerEnvController.ResetScene() reads.
#   0 = empty goal (2 strikers, no keeper), 1 = 2 strikers vs 1 keeper, 2 = full 3v3 self-play.
#
# Threshold derivation -- "measure: reward" reads ONLY the individual reward
# (Environment/Cumulative Reward). Group rewards are tracked separately as
# Environment/Group Cumulative Reward and never reach the curriculum
# (see mlagents/trainers/poca/trainer.py:121 vs :124).
# So one striker episode of individual reward =
#     goal mirror (+/-1) + existential (-t/3000) + S2 touch bonus (<= 0.1)
#   scores at t=600  ->  +1 - 0.20 + 0.05 ~= 0.85
#   scores at t=1650 ->  +1 - 0.55 + 0.05 ~= 0.50
#   times out, no goal -> -1 + 0.1 = -0.90
# Lesson0 threshold 0.5 = "reliably scores on an empty goal within ~1650 steps"
# Lesson1 threshold 0.2 = "scores against a keeper roughly 70% of episodes"
# (the old 0.8 was set when MaxEnvironmentSteps was 50000; unreachable at the current scale)
#
# In lessons 0-1 only one team is on the pitch, so self-play is effectively solo training.
# ResetScene() picks the attacking team at random each episode, so both team ids still
# collect data; real self-play (and a meaningful ELO) only starts at lesson 2.
environment_parameters:
  lesson:
    curriculum:
      - name: EmptyGoal
        completion_criteria:
          measure: reward
          behavior: Striker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.0
      - name: VsGoalie
        completion_criteria:
          measure: reward
          behavior: Striker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.2
        value: 1.0
      - name: SelfPlay
        value: 2.0
