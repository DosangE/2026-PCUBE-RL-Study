# UnderCooked - MA-POCA 2인 협동 요리
#
# 실행:
#   conda activate mlagents
#   cd week7-8/UnderCooked-Hyeongjun
#   mlagents-learn configs/undercooked.yaml --run-id=undercooked_v1
#   (Listening on port 5004 뜨면 Unity 에디터에서 Play)
#
# behaviors 키 'Chef' 는 Behavior Parameters의 Behavior Name과 대소문자까지 일치해야 한다.
# environment_parameters 키(target_soups / cook_time)는 KitchenEnv.ResetEnv()가 읽는 이름과 같아야 한다.

behaviors:
  Chef:
    trainer_type: poca

    hyperparameters:
      batch_size: 1024        # sequence_length(64)의 배수여야 RNN 학습이 깔끔하다
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true         # 관측 45차원, 값 범위가 섞여 있으므로 필수
      hidden_units: 256
      num_layers: 2
      memory:
        # 조리 진행도를 관측에서 일부러 뺐다.
        # "냄비를 언제 채웠는지"를 에이전트가 기억해야 하므로 RNN이 필요하다.
        sequence_length: 64
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 8000000
    time_horizon: 128         # 에피소드가 약 300 decision이라 128이면 충분
    summary_freq: 20000

environment_parameters:
  # ── 목표 수프 개수: 1 -> 2 -> 3 ──────────────────────────────
  # 에피소드 성공 시 에이전트당 누적 보상 대략치
  #   lesson0(1개): 팀 3.9 + 목표보너스 2.0 + 개인 ~0.4 - 스텝비용 ≈ 6.0
  #   lesson1(2개): ≈ 10.1
  #   lesson2(3개): ≈ 14.0
  # threshold는 "절반쯤 성공하는 수준"으로 잡았다. 실제 곡선 보고 조정할 것.
  target_soups:
    curriculum:
      - name: lesson0
        completion_criteria:
          measure: reward
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 3.0
        value: 1.0
      - name: lesson1
        completion_criteria:
          measure: reward
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 6.0
        value: 2.0
      - name: lesson2
        value: 3.0

  # ── 조리 시간: 2초 -> 5초 ────────────────────────────────────
  # 초반에는 짧게 해서 "재료 3개 -> 수프" 인과를 빨리 잡게 하고,
  # 학습이 35% 진행되면 실제 난이도(5초)로 올린다. 대기 시간이 길수록 RNN 부담이 커진다.
  cook_time:
    curriculum:
      - name: lesson0
        completion_criteria:
          measure: progress
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.35
        value: 2.0
      - name: lesson1
        value: 5.0
