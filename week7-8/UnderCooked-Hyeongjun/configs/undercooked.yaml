# UnderCooked - MA-POCA, 2 cooperating chefs.
#
# ASCII ONLY. Do not put non-ASCII characters (Korean comments included) in this file.
# mlagents' load_config() opens it with the OS default codepage (cp949 on this machine),
# not UTF-8, so any non-ASCII byte aborts training before it starts.
# Design rationale lives in ../README.md instead.
#
# Run:
#   cd week7-8/UnderCooked-Hyeongjun
#   mlagents-learn configs/undercooked.yaml --run-id=undercooked_v1
#   (press Play in the Unity editor once it says "Listening on port 5004")
#
# The 'Chef' key must match Behavior Parameters > Behavior Name exactly.
# environment_parameters keys must match the names KitchenEnv.ResetEnv() reads.

behaviors:
  Chef:
    trainer_type: poca

    hyperparameters:
      batch_size: 1024        # multiple of sequence_length (64)
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 8000000
    time_horizon: 128         # episode is ~300 decisions
    summary_freq: 20000

environment_parameters:
  # Target soups per episode: 1 -> 2 -> 3
  # Approx. cumulative reward per agent on a successful episode:
  #   lesson0 (1 soup): ~6.0    lesson1 (2): ~10.1    lesson2 (3): ~14.0
  # Thresholds are set around "succeeds about half the time".
  target_soups:
    curriculum:
      - name: lesson0
        completion_criteria:
          measure: reward
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 3.0
        value: 1.0
      - name: lesson1
        completion_criteria:
          measure: reward
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 6.0
        value: 2.0
      - name: lesson2
        value: 3.0

  # Cook time: 2s -> 5s.
  # Short at first so the "3 ingredients -> soup" causal link is easy to pick up,
  # then raised to the real difficulty once training is 35% through.
  cook_time:
    curriculum:
      - name: lesson0
        completion_criteria:
          measure: progress
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.35
        value: 2.0
      - name: lesson1
        value: 5.0
